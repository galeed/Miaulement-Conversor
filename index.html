<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miaulement Convertidor</title>

<!-- Codificador LAME MP3 liviano integrado para ejecución local -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600&display=swap');

  :root {
    --neon-cyan: #00f5ff;
    --neon-pink: #ff00aa;
    --neon-green: #00ff88;
    --neon-yellow: #ffee00;
    --neon-purple: #bf00ff;
    --bg-dark: #020408;
    --bg-card: #050d14;
    --bg-panel: #080f1a;
    --border-glow: rgba(0,245,255,0.3);
    --text-main: #c8eeff;
    --text-dim: #4a7a8a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
    animation: gridPulse 8s ease-in-out infinite;
  }

  @keyframes gridPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  header {
    text-align: center;
    padding: 40px 0 30px;
    position: relative;
  }

  .logo-cat {
    font-size: 48px;
    display: block;
    margin-bottom: 4px;
    filter: drop-shadow(0 0 20px var(--neon-cyan));
    animation: catFloat 3s ease-in-out infinite;
  }

  @keyframes catFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(24px, 5vw, 42px);
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-cyan));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  .tagline {
    font-family: 'Share Tech Mono', monospace;
    color: var(--neon-green);
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 6px;
    text-shadow: 0 0 10px var(--neon-green);
    opacity: 0.8;
  }

  .header-line {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-pink), transparent);
    margin-top: 24px;
    position: relative;
  }

  .header-line::after {
    content: '◆';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--neon-cyan);
    font-size: 10px;
    text-shadow: 0 0 10px var(--neon-cyan);
    background: var(--bg-dark);
    padding: 0 8px;
  }

  .main-card {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 4px;
    padding: 32px;
    position: relative;
    margin-bottom: 20px;
    box-shadow: 0 0 30px rgba(0,245,255,0.05), inset 0 0 30px rgba(0,0,0,0.5);
  }

  .corner-tag {
    position: absolute;
    top: 8px; right: 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  .drop-zone {
    border: 2px dashed rgba(0,245,255,0.25);
    border-radius: 4px;
    padding: 48px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    background: rgba(0,245,255,0.02);
  }

  .drop-zone:hover, .drop-zone.dragging {
    border-color: var(--neon-cyan);
    background: rgba(0,245,255,0.06);
    box-shadow: 0 0 20px rgba(0,245,255,0.15);
  }

  .drop-icon {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
    filter: drop-shadow(0 0 12px var(--neon-cyan));
  }

  .drop-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    color: var(--neon-cyan);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .drop-sub {
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
  }

  .file-info {
    display: none;
    background: rgba(0,245,255,0.05);
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 4px;
    padding: 16px 20px;
    margin-top: 20px;
    align-items: center;
    gap: 16px;
  }

  .file-info.visible { display: flex; }
  .file-details { flex: 1; }

  .file-name {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--neon-cyan);
    word-break: break-all;
  }

  .file-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    font-family: 'Share Tech Mono', monospace;
  }

  .btn-clear {
    background: none;
    border: 1px solid rgba(255,0,170,0.4);
    color: var(--neon-pink);
    padding: 6px 14px;
    border-radius: 2px;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
  }

  .settings-panel { margin-top: 24px; }

  .section-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--neon-pink);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-label::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(255,0,170,0.3), transparent);
  }

  .format-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }

  .fmt-tab {
    flex: 1;
    min-width: 70px;
    padding: 10px 8px;
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 2px;
    background: var(--bg-panel);
    color: var(--text-dim);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }

  .fmt-tab.active {
    border-color: var(--neon-cyan);
    background: rgba(0,245,255,0.08);
    color: var(--neon-cyan);
    box-shadow: 0 0 12px rgba(0,245,255,0.2);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .field { display: flex; flex-direction: column; gap: 6px; }

  label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  select {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 2px;
    color: var(--text-main);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    transition: all 0.2s;
  }

  select:hover, select:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 8px rgba(0,245,255,0.2);
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border: 1px solid rgba(0,245,255,0.1);
    border-radius: 4px;
    background: rgba(0,245,255,0.02);
    cursor: pointer;
  }

  .btn-convert {
    width: 100%;
    padding: 18px;
    margin-top: 28px;
    background: transparent;
    border: 2px solid var(--neon-cyan);
    border-radius: 4px;
    color: var(--neon-cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-convert:hover {
    background: rgba(0,245,255,0.08);
    box-shadow: 0 0 30px rgba(0,245,255,0.25);
  }

  .progress-area { display: none; margin-top: 20px; }
  .progress-area.visible { display: block; }

  .progress-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--neon-cyan);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  .progress-bar {
    height: 6px;
    background: rgba(0,245,255,0.08);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid rgba(0,245,255,0.1);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
    width: 0%;
    transition: width 0.2s;
  }

  .result-area {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border: 1px solid rgba(0,255,136,0.3);
    border-radius: 4px;
    background: rgba(0,255,136,0.04);
    text-align: center;
  }

  .result-area.visible { display: block; }

  .btn-download {
    display: inline-block;
    padding: 12px 32px;
    background: rgba(0,255,136,0.1);
    border: 1px solid var(--neon-green);
    border-radius: 3px;
    color: var(--neon-green);
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
  }

  .error-msg {
    display: none;
    margin-top: 16px;
    padding: 14px 18px;
    border: 1px solid rgba(255,0,170,0.4);
    border-radius: 3px;
    background: rgba(255,0,170,0.05);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--neon-pink);
  }

  .error-msg.visible { display: block; }

  footer {
    text-align: center;
    padding: 24px 0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
  }
</style>

<body>

<div class="container">
  <header>
    <span class="logo-cat">🐱</span>
    <h1>MIAULEMENT CONVERTIDOR</h1>
    <div class="tagline">// NATIVE AUDIO ENGINE v3.5 //</div>
    <div class="header-line"></div>
  </header>

  <div class="main-card">
    <div class="corner-tag">[ SYS_AUDIO_LOCAL ]</div>

    <!-- DROP ZONE -->
    <div class="drop-zone" id="dropZone">
      <span class="drop-icon">🎵</span>
      <div class="drop-title">CARGAR ARCHIVO DE AUDIO</div>
      <div class="drop-sub">haz clic aquí o arrastra un archivo de audio</div>
      <input type="file" id="fileInput" accept="audio/*,.wav,.flac,.mp3,.ogg,.m4a,.aiff" style="display:none">
    </div>

    <!-- FILE INFO -->
    <div class="file-info" id="fileInfo">
      <span style="font-size:24px">📂</span>
      <div class="file-details">
        <div class="file-name" id="fileName">—</div>
        <div class="file-meta" id="fileMeta">—</div>
      </div>
      <button class="btn-clear" id="btnClear">✕ LIMPIAR</button>
    </div>

    <!-- SETTINGS PANEL -->
    <div class="settings-panel" id="settingsPanel" style="display:none">

      <div class="section-label">FORMATO DE SALIDA</div>

      <div class="format-tabs" id="formatTabs">
        <button class="fmt-tab active" data-fmt="wav">WAV</button>
        <button class="fmt-tab" data-fmt="mp3">MP3</button>

        <button class="fmt-tab" data-fmt="m4a">M4A</button>
        <button class="fmt-tab" data-fmt="ogg">OGG</button>
        <button class="fmt-tab" data-fmt="flac">FLAC</button>
        <button class="fmt-tab" data-fmt="aiff">AIFF</button>
      </div>

      <div class="grid-2" style="margin-top:16px;">
        <div class="field">
          <label>SAMPLE RATE (FRECUENCIA DE MUESTREO)</label>
          <select id="sampleRateSelect">
            <option value="44100">44100 Hz (CD)</option>
            <option value="48000" selected>48000 Hz (Estudio / Video)</option>
            <option value="88200">88200 Hz (Hi-Res)</option>
            <option value="96000">96000 Hz (Hi-Res Master)</option>
          </select>
        </div>

        <!-- OPCIONES PCM / BIT DEPTH (Para WAV, FLAC, AIFF) -->
        <div class="field" id="bitDepthContainer">
          <label>BIT DEPTH / RESOLUCIÓN</label>
          <select id="bitDepthSelect">
            <option value="16">16 bits (PCM CD)</option>
            <option value="24" selected>24 bits (PCM Studio)</option>
            <option value="32">32 bits (Float)</option>
          </select>
        </div>

        <!-- OPCIONES BITRATE / FRECUENCIA DE BITS (Para MP3, M4A, OGG) -->
        <div class="field" id="bitrateContainer" style="display:none;">
          <label>BITRATE (FRECUENCIA DE BITS)</label>
          <select id="bitrateSelect">
            <option value="320">320 kbps (Calidad Máxima / Studio)</option>
            <option value="256" selected>256 kbps (Alta Calidad)</option>
            <option value="192">192 kbps (Estándar)</option>
            <option value="128">128 kbps (Calidad Media)</option>
            <option value="96">96 kbps (Bajo peso / Voz)</option>
          </select>
        </div>
      </div>

      <div style="margin-top:16px" id="ditherRow">
        <label class="toggle-row">
          <input type="checkbox" id="ditherCheck" checked>
          <span style="font-family:'Share Tech Mono'; font-size:12px; color:var(--text-main);">APLICAR DITHER TPDF (Recomendado al reducir Bit Depth)</span>
        </label>
      </div>

      <button class="btn-convert" id="convertBtn">⚡ CONVERTIR AUDIO</button>

      <div class="progress-area" id="progressArea">
        <div class="progress-label">
          <span id="logArea">Procesando...</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <div class="result-area" id="resultArea">
        <div style="font-size:32px; margin-bottom:8px">✅</div>
        <div style="font-family:'Orbitron'; font-size:14px; color:var(--neon-green); margin-bottom:12px">CONVERSIÓN COMPLETADA</div>
        <a class="btn-download" id="downloadBtn">⬇ DESCARGAR ARCHIVO</a>
      </div>

    </div>
  </div>

  <footer>
    <span>🐱 MIAULEMENT</span> CONVERTIDOR &nbsp;·&nbsp; LOCAL & OFFLINE ENGINE
  </footer>
</div>

<script>
let currentFile = null;
let currentFormat = 'wav';

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const btnClear = document.getElementById('btnClear');
const convertBtn = document.getElementById('convertBtn');
const bitDepthContainer = document.getElementById('bitDepthContainer');
const bitrateContainer = document.getElementById('bitrateContainer');
const ditherRow = document.getElementById('ditherRow');

// SELECCIÓN Y CARGA DE ARCHIVOS
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) {
    handleFile(e.target.files[0]);
  }
});

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragging');
});

dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));

dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragging');
  if (e.dataTransfer.files && e.dataTransfer.files[0]) {
    handleFile(e.dataTransfer.files[0]);
  }
});

btnClear.addEventListener('click', () => {
  currentFile = null;
  fileInput.value = '';
  document.getElementById('fileInfo').classList.remove('visible');
  document.getElementById('settingsPanel').style.display = 'none';
  resetUI();
});

function handleFile(file) {
  currentFile = file;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileMeta').textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB · ${file.type || 'Audio'}`;
  document.getElementById('fileInfo').classList.add('visible');
  document.getElementById('settingsPanel').style.display = 'block';
  resetUI();
}

// CAMBIO DE PESTAÑAS Y ADAPTACIÓN DE INTERFAZ
document.querySelectorAll('.fmt-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.fmt-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFormat = tab.dataset.fmt;

    if (['mp3', 'm4a', 'ogg'].includes(currentFormat)) {
      bitDepthContainer.style.display = 'none';
      bitrateContainer.style.display = 'flex';
      ditherRow.style.display = 'none';
    } else {
      bitDepthContainer.style.display = 'flex';
      bitrateContainer.style.display = 'none';
      ditherRow.style.display = 'block';
    }

    resetUI();
  });
});

function resetUI() {
  document.getElementById('resultArea').classList.remove('visible');
  document.getElementById('errorMsg').classList.remove('visible');
  document.getElementById('progressArea').classList.remove('visible');
  document.getElementById('progressFill').style.width = '0%';
}

// PROCESO DE CONVERSIÓN
convertBtn.addEventListener('click', async () => {
  if (!currentFile) return;

  resetUI();
  document.getElementById('progressArea').classList.add('visible');
  convertBtn.disabled = true;

  try {
    updateProgress(10, 'Leyendo datos del archivo...');
    const arrayBuffer = await currentFile.arrayBuffer();

    updateProgress(30, 'Decodificando audio...');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

    const targetSampleRate = parseInt(document.getElementById('sampleRateSelect').value);
    const bitDepth = parseInt(document.getElementById('bitDepthSelect').value);
    const targetBitrate = parseInt(document.getElementById('bitrateSelect').value);
    const applyDither = document.getElementById('ditherCheck').checked;

    updateProgress(50, 'Resampleando y procesando canales...');
    const offlineCtx = new OfflineAudioContext(
      audioBuffer.numberOfChannels,
      audioBuffer.duration * targetSampleRate,
      targetSampleRate
    );

    const source = offlineCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(offlineCtx.destination);
    source.start();

    const renderedBuffer = await offlineCtx.startRendering();

    updateProgress(75, `Codificando formato ${currentFormat.toUpperCase()}...`);
    let outputBlob;
    let extension = currentFormat;

    if (currentFormat === 'wav' || currentFormat === 'aiff' || currentFormat === 'flac') {
      outputBlob = encodeWAVorAIFF(renderedBuffer, bitDepth, applyDither, currentFormat === 'aiff' ? 'aiff' : 'wav');
    } else if (currentFormat === 'mp3') {
      outputBlob = await encodeMP3(renderedBuffer, targetBitrate);
    } else if (currentFormat === 'm4a' || currentFormat === 'ogg') {
      outputBlob = await encodeCompressedNative(renderedBuffer, currentFormat, targetBitrate);
    }

    const url = URL.createObjectURL(outputBlob);
    const baseName = currentFile.name.replace(/\.[^/.]+$/, "");
    const downloadBtn = document.getElementById('downloadBtn');
    
    downloadBtn.href = url;
    downloadBtn.download = `${baseName}_miaulement.${extension}`;

    updateProgress(100, '¡Completado!');
    document.getElementById('resultArea').classList.add('visible');

  } catch (err) {
    document.getElementById('errorMsg').textContent = '⚠ Error al procesar el audio: ' + err.message;
    document.getElementById('errorMsg').classList.add('visible');
  } finally {
    convertBtn.disabled = false;
  }
});

function updateProgress(pct, msg) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('logArea').textContent = '// ' + msg;
}

// CODIFICADOR MP3 LAME NATIVO
async function encodeMP3(buffer, bitrate) {
  if (typeof Mp3LameEncoder !== 'undefined' || typeof lamejs !== 'undefined') {
    const channels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, bitrate);
    const mp3Data = [];

    const left = buffer.getChannelData(0);
    const right = channels > 1 ? buffer.getChannelData(1) : left;

    const sampleBlockSize = 1152;
    const leftInt16 = new Int16Array(left.length);
    const rightInt16 = new Int16Array(right.length);

    for (let i = 0; i < left.length; i++) {
      leftInt16[i] = Math.max(-32768, Math.min(32767, left[i] * 32767));
      rightInt16[i] = Math.max(-32768, Math.min(32767, right[i] * 32767));
    }

    for (let i = 0; i < leftInt16.length; i += sampleBlockSize) {
      const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
      const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);
      let mp3buf;
      if (channels === 2) {
        mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
      } else {
        mp3buf = mp3encoder.encodeBuffer(leftChunk);
      }
      if (mp3buf.length > 0) mp3Data.push(mp3buf);
    }

    const mp3end = mp3encoder.flush();
    if (mp3end.length > 0) mp3Data.push(mp3end);

    return new Blob(mp3Data, { type: 'audio/mp3' });
  } else {
    throw new Error("Librería de codificación MP3 no cargada correctamente.");
  }
}

// CODIFICADOR NATIVO (M4A / OGG) VÍA MEDIASTREAM DESTINATION
async function encodeCompressedNative(buffer, format, bitrate) {
  return new Promise((resolve, reject) => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: buffer.sampleRate });
    const source = ctx.createBufferSource();
    source.buffer = buffer;

    const dest = ctx.createMediaStreamDestination();
    source.connect(dest);

    let mimeType = format === 'm4a' ? 'audio/mp4' : 'audio/ogg';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = format === 'm4a' ? 'audio/aac' : 'audio/webm;codecs=opus';
    }

    const mediaRecorder = new MediaRecorder(dest.stream, {
      mimeType: mimeType,
      audioBitsPerSecond: bitrate * 1000
    });

    const chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      resolve(new Blob(chunks, { type: mimeType }));
    };

    source.start(0);
    mediaRecorder.start();

    source.onended = () => {
      mediaRecorder.stop();
    };
  });
}

// CODIFICADOR WAV / AIFF CON DITHER TPDF
function encodeWAVorAIFF(buffer, bitDepth, dither, format) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length;
  const bytesPerSample = bitDepth / 8;
  const blockAlign = numChannels * bytesPerSample;
  const bufferLength = 44 + (length * blockAlign);
  
  const arrayBuffer = new ArrayBuffer(bufferLength);
  const view = new DataView(arrayBuffer);

  const writeString = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };

  writeString(0, format === 'wav' ? 'RIFF' : 'FORM');
  view.setUint32(4, 36 + (length * blockAlign), false);
  writeString(8, format === 'wav' ? 'WAVE' : 'AIFF');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, bitDepth === 32 ? 3 : 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitDepth, true);
  writeString(36, 'data');
  view.setUint32(40, length * blockAlign, true);

  const channels = [];
  for (let i = 0; i < numChannels; i++) {
    channels.push(buffer.getChannelData(i));
  }

  let offset = 44;
  for (let i = 0; i < length; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      let sample = channels[ch][i];

      if (dither && bitDepth < 32) {
        const noise = (Math.random() - Math.random()) / (1 << bitDepth);
        sample += noise;
      }

      sample = Math.max(-1, Math.min(1, sample));

      if (bitDepth === 16) {
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
      } else if (bitDepth === 24) {
        const val = Math.floor(sample < 0 ? sample * 0x800000 : sample * 0x7FFFFF);
        view.setUint8(offset, val & 0xFF);
        view.setUint8(offset + 1, (val >> 8) & 0xFF);
        view.setUint8(offset + 2, (val >> 16) & 0xFF);
      } else if (bitDepth === 32) {
        view.setFloat32(offset, sample, true);
      }
      offset += bytesPerSample;
    }
  }

  return new Blob([arrayBuffer], { type: `audio/${format}` });
}
